name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | grep -i version | cut -d'"' -f2 | cut -d'.' -f1)
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | grep -i version | cut -d'"' -f2 | cut -d'.' -f2)
          fi
          
          if [ -z "$JAVA_VERSION" ]; then
            echo "Failed to detect Java version"
            exit 1
          fi
          
          echo "Active Java major version: $JAVA_VERSION"
          
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Java version is lower than 17. Failing."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore missing, generating one..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "Failed to create debug.keystore"
            exit 1
          fi
          echo "debug.keystore successfully generated/verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APKs in app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "APK file is empty!"
            exit 1
          fi
          
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "APK file does not have .apk extension!"
            exit 1
          fi
          
          echo "Verified APK exists, is not empty, and has .apk extension: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(basename "${{ github.repository }}" | tr -dc 'a-zA-Z0-9-')
          APK_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$TEMP_DIR/$APK_NAME"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          
          echo "release_asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "release_asset_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Release asset missing at $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Release asset is empty!"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          cat << 'EOF' > release_notes.txt
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          The GitHub Actions run number: ${{ github.run_number }}
          The GitHub Actions run attempt: ${{ github.run_attempt }}
          The source commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.txt \
            --latest

      - name: Report APK download result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release was published successfully."
            gh release view "$TAG"
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${{ steps.prepare_asset.outputs.release_asset_name }}"
            
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded from the release Assets section at the following URL:" >> $GITHUB_STEP_SUMMARY
            echo "[Download Release APK]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup in the Artifacts section." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed!"
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."
            
            echo "### ⚠️ APK Build Successful, but Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK was built successfully, but it could not be published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named \`app-debug-apk\` remains available as a backup. You can download it from the Artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
